<html>
    <head>
        <title>Tiều đề trang</title>
    </head>
    <body  style="background-color:rgb(18, 113, 156)">
      <div style="text-align: center;"><img src="images/Jackson.gif" alt="Jackson" ></div>
    <h1 style="text-align: center;">Registration Form</h1>
      <p style="text-align: center;"> Register your Jackson Electronics product here</p>
      <table border="0" align="center" style="margin: auto; border-bottom: 1px solid black; width: 600px;">
        <tr>
            <td> First Name:</td>
            <td><input type="text" name="first_name" id="first_name"></td>

            <td> Last Name:</td>
            <td><input type="text" name="last_name" id="last_name"></td>
        <tr>
            <td> Address#1:</td>
            <td colspan="3"><input type="text" name="address" id="address" ></td>
        </tr>
        <tr>
            <td> Address#2:</td>
            <td colspan="3"><input type="text" name="address" id="address" ></td>
        </tr>
        <tr>
            <td> City:</td>
            <td><input type="text" name="city" id="city"></td>
            <td> State:</td>
            <td><input type="text" name="state" id="state"></td>
            <td> Zip:</td>
            <td><input type="text" name="zip_code" id="zip_code">
        </tr>
        <tr>
            <td> Country:</td>
            <td><input type="text" name="country" id="country"></td>
         <tr>
        </tr>
      <table border="0" align="center" style="margin: auto; border-bottom: 1px solid black; width: 600px;" cellpadding="10" cellspacing="0">
        <tr>
            <td> Product:</td>
            <td colspan="3"><input type="list" name="product_model" id="product_model"></td>
        </tr>
        <tr>
            <td> Date Purchased:</td>
            <td colspan="3"><input type="date" name="purchase_date" id="purchase_date"></td>
        </tr>
        <tr>
            <td> Serial Number:</td>
            <td colspan="3"><input type="text" name="serial_number" id="serial_number"></td>
        </tr>
            <tr>
                <td rowspan="2"> Use for:</td>
                <td>
                    <input type="radio" name="usefor" id="usefor_personal" value="personal">
                    <label for="usefor_personal">Personal</label>
                </td>
                <td>
                      <input type="radio" name="usefor" id="usefor_education" value="education">
                    <label for="usefor_education">Education Instruction</label>
               
                </td>
            </tr>
            <tr>
                <td>
                   <input type="radio" name="usefor" id="usefor_business" value="business">
                    <label for="usefor_business">Business</label>
                </td>
                <td>
                    <input type="radio" name="usefor" id="usefor_other" value="other">
                    <label for="usefor_other">Other</label>
                </td>
            </tr>
                <tr>
                <td rowspan="2"> System (check all that apply):</td>
                <td>
                    <input type="checkbox" name="usefor" id="Windows" value="Windows">
                    <label for="Windows">Windows</label>
                </td>
                <td>
                      <input type="checkbox" name="usefor" id="UNIX" value="UNIX">
                    <label for="UNIX">UNIX</label>
               
                </td>
            </tr>
            <tr>
                <td>
                   <input type="checkbox" name="usefor" id="Macintosh" value="Macintosh">
                    <label for="Macintosh">Macintosh</label>
                </td>
                <td>
                    <input type="checkbox" name="usefor" id="usefor_other" value="other">
                    <label for="usefor_other">Other</label>
                </td>
            </tr>
        </table>
      <table border="0" align="center" style="margin: auto; border-bottom: 1px solid black; width: 600px;" cellpadding="10" cellspacing="0">
            <tr>
                <td> Comments:</td>
                <td colspan="3"><textarea name="comments" id="comments" rows="4" cols="50"></textarea></td>
            </tr>
            <tr>
                <td colspan="4" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
      </table>
        </table>
    </body>
</html>
